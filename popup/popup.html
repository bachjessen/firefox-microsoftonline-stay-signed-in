<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Stay signed in</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">STAY SIGNED IN</p>
      <h1 id="saved">0 seconds saved</h1>
      <p id="count" class="summary">0 prompts handled</p>
    </header>

    <section aria-labelledby="automation-title">
      <h2 id="automation-title">When the prompt appears</h2>
      <fieldset class="choice-group">
        <legend class="visually-hidden">Choose an automatic response</legend>
        <label class="choice"><input type="radio" name="response" value="yes"><span><strong>Stay signed in</strong><small>Automatically choose Yes</small></span></label>
        <label class="choice"><input type="radio" name="response" value="no"><span><strong>Don't stay signed in</strong><small>Automatically choose No</small></span></label>
        <label class="choice"><input type="radio" name="response" value="none"><span><strong>Ask me every time</strong><small>Leave the prompt untouched</small></span></label>
      </fieldset>
      <label class="setting-row">
        <span><strong>Hide future prompts</strong><small>Check “Don't show this again”</small></span>
        <span class="switch"><input id="checkCheckbox" type="checkbox"><span aria-hidden="true"></span></span>
      </label>
    </section>

    <section aria-labelledby="sync-title">
      <h2 id="sync-title">Data</h2>
      <label class="setting-row">
        <span><strong>Sync across devices</strong><small>Use your browser account for settings and statistics</small></span>
        <span class="switch"><input id="syncEnabled" type="checkbox"><span aria-hidden="true"></span></span>
      </label>
    </section>

    <footer>Time saved is estimated at 12 seconds per handled prompt.</footer>
  </main>
  <script src="popup.js"></script>
</body>
</html>
