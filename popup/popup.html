<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Stay signed in</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header>
      <small>STAY SIGNED IN</small>
      <h1 id="saved">0 seconds saved</h1>
      <p id="count">0 prompts handled</p>
    </header>

    <section>
      <label class="setting">
        <span><strong>Enable automation</strong><small>Handle the Microsoft prompt automatically</small></span>
        <input id="automationEnabled" type="checkbox" role="switch">
      </label>
    </section>

    <div id="automationOptions">
      <section>
        <fieldset>
          <legend>When the prompt appears</legend>
          <label><input type="radio" name="response" value="yes"> Stay signed in automatically</label>
          <label><input type="radio" name="response" value="no"> Decline automatically</label>
        </fieldset>

        <label id="dontAskAgainSetting" class="setting">
          <span><strong>Don't ask again</strong><small>Check “Don't show this again”</small></span>
          <input id="checkCheckbox" type="checkbox" role="switch">
        </label>
      </section>

      <section>
        <label class="setting">
          <span><strong>Sync across devices</strong><small>Use your browser account for settings and statistics</small></span>
          <input id="syncEnabled" type="checkbox" role="switch">
        </label>
      </section>
    </div>

    <footer>Estimated at 12 seconds saved per handled prompt.</footer>
  </main>
  <script src="popup.js"></script>
</body>
</html>
