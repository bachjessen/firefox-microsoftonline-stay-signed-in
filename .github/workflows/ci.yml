name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint extension
        run: npm run lint
      - name: Build extension
        run: npm run build
      - name: Upload unsigned package
        uses: actions/upload-artifact@v4
        with:
          name: firefox-extension-unsigned
          path: web-ext-artifacts/*.zip
          if-no-files-found: error
