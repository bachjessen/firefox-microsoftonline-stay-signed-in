name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    if: ${{ github.actor == github.repository_owner }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint extension
        run: npm run lint
      - name: Build extension
        run: npm run build
      - name: Submit private release to Mozilla Add-ons
        run: npx web-ext sign --channel=unlisted --ignore-files test-page.html CHANGELOG.md screenshot.png build.sh package.json package-lock.json .github/** --api-key="$AMO_JWT_ISSUER" --api-secret="$AMO_JWT_SECRET"
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
      - name: Upload signed XPI
        uses: actions/upload-artifact@v4
        with:
          name: firefox-extension-signed
          path: web-ext-artifacts/*.xpi
          if-no-files-found: error
