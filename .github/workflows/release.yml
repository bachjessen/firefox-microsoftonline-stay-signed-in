name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify tag matches manifest version
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./manifest.json').version")"
      - name: Lint extension
        run: npm run lint
      - name: Build extension
        run: npm run build
      - name: Submit listed release to Mozilla Add-ons
        run: npx web-ext sign --channel=listed --api-key="$AMO_JWT_ISSUER" --api-secret="$AMO_JWT_SECRET"
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
      - name: Publish GitHub release with unsigned source package
        uses: softprops/action-gh-release@v2
        with:
          files: web-ext-artifacts/*.zip
          generate_release_notes: true
