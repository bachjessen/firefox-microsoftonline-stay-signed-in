name: Private Firefox Update

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: private-firefox-signing
  cancel-in-progress: false

jobs:
  sign-private-update:
    if: ${{ github.actor == github.repository_owner && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm run audit

      - name: Enforce private-only Firefox publishing
        run: npm run check:private-release

      - name: Lint extension
        run: npm run lint

      - name: Build browser distributions
        run: npm run build

      - name: Sign private unlisted Firefox update
        run: npx web-ext sign --source-dir=dist/firefox --artifacts-dir=web-ext-artifacts --channel=unlisted --api-key="$AMO_JWT_ISSUER" --api-secret="$AMO_JWT_SECRET"
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}

      - name: Upload signed private XPI
        uses: actions/upload-artifact@v4
        with:
          name: stay-signed-in-actually-private
          path: web-ext-artifacts/*.xpi
          if-no-files-found: error
          retention-days: 7
