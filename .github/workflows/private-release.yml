name: Private Firefox Update

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sign-private-update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint extension
        run: npm run lint

      - name: Sign private unlisted update
        run: npx web-ext sign --channel=unlisted --ignore-files test-page.html test-page-11oct2026.html CHANGELOG.md screenshot.png build.sh package.json package-lock.json .github/** --api-key="$AMO_JWT_ISSUER" --api-secret="$AMO_JWT_SECRET"
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}

      - name: Upload signed private XPI
        uses: actions/upload-artifact@v4
        with:
          name: microsoft-online-stay-signed-in-private-1.2.0
          path: web-ext-artifacts/*.xpi
          if-no-files-found: error
