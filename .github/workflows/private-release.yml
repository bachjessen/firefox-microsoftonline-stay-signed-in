name: Private Firefox Update

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: private-firefox-signing
  cancel-in-progress: false

jobs:
  sign-private-update:
    if: ${{ github.actor == github.repository_owner }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Read extension version
        id: version
        run: echo "version=$(node -p "require('./manifest.json').version")" >> "$GITHUB_OUTPUT"

      - name: Audit dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint extension
        run: npm run lint

      - name: Sign private unlisted update
        run: npx web-ext sign --channel=unlisted --ignore-files test-page.html test-page-11oct2026.html CHANGELOG.md screenshot.png build.sh package.json package-lock.json .github/** --api-key="$AMO_JWT_ISSUER" --api-secret="$AMO_JWT_SECRET"
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}

      - name: Upload signed private XPI
        uses: actions/upload-artifact@v4
        with:
          name: stay-signed-in-actually-private-${{ steps.version.outputs.version }}
          path: web-ext-artifacts/*.xpi
          if-no-files-found: error
          retention-days: 7
